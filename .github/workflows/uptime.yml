name: Pantau kesehatan sumber

# Sebelumnya tidak ada satu pun alarm: bila penjadwal luar (refresh.yml)
# berhenti atau sebuah sumber gagal berjam-jam, stempel di layar menua tetapi
# tak seorang pun diberi tahu. Alur kerja ini memeriksa /api/status tiap 5
# menit dan membuka/menutup satu tiket GitHub: tanpa rahasia tambahan,
# memakai GITHUB_TOKEN bawaan runner.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime-firewatch
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Ambil /api/status
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://firewatch-id.vercel.app' }}
        run: |
          set -euo pipefail
          curl -sS --max-time 45 -H 'Accept: application/json' "$BASE_URL/api/status" -o /tmp/status.json
          # Endpoint harus mengembalikan JSON; halaman galat HTML berarti
          # aplikasinya sendiri yang bermasalah, bukan sumbernya.
          python3 -c "import json;json.load(open('/tmp/status.json'))" \
            || { echo "Balasan /api/status bukan JSON, aplikasi tidak sehat"; exit 1; }

      - name: Nilai kesehatan sumber
        id: nilai
        run: |
          set +e
          python3 scripts/uptime_check.py /tmp/status.json
          echo "kode=$?" >> "$GITHUB_OUTPUT"

      - name: Buka atau perbarui tiket
        if: steps.nilai.outputs.kode != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search 'in:title "[uptime]"' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file /tmp/uptime_body.md
          else
            gh issue create --title "[uptime] Sumber data gagal, $(date -u '+%d %b %H:%M UTC')" --body-file /tmp/uptime_body.md
          fi

      - name: Tutup tiket bila sudah normal
        if: steps.nilai.outputs.kode == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          num=$(gh issue list --state open --search 'in:title "[uptime]"' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" --comment "Sumber kembali dalam batas normal (dipantau tiap 5 menit)."
          fi
