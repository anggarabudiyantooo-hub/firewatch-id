version: 2

# Pembaruan ketergantungan otomatis. Dikelompokkan supaya tidak berisik:
# satu PR untuk ketergantungan produksi, satu untuk pengembangan, per minggu.
# Setiap PR tetap harus lolos gerbang CI sebelum digabung.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      produksi:
        dependency-type: production
        update-types:
          - minor
          - patch
      pengembangan:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Express 5 adalah migrasi besar. Dinaikkan sengaja lewat pekerjaan
      # tersendiri, bukan lewat PR otomatis.
      - dependency-name: express
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
