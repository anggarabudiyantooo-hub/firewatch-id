<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Admin sign-in · SIAGA.ID</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f2f5f9; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 430px); border: 1px solid #d8e0eb; border-radius: 18px; background: #fff; padding: clamp(24px, 6vw, 40px); box-shadow: 0 18px 52px #13294b15; }
    .brand { color: #166c55; font-weight: 800; letter-spacing: .09em; font-size: .82rem; }
    h1 { margin: 18px 0 8px; font-size: clamp(1.45rem, 5vw, 1.8rem); line-height: 1.2; }
    p { color: #5b6678; line-height: 1.55; margin: 0 0 24px; }
    label { display: block; font-weight: 650; margin-bottom: 8px; }
    input { width: 100%; min-height: 48px; border: 1px solid #aab6c7; border-radius: 10px; padding: 10px 12px; color: inherit; font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid #4bb99c80; outline-offset: 2px; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: #116b53; color: #fff; font: inherit; font-weight: 700; margin-top: 16px; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #status { min-height: 1.5em; margin: 14px 0 0; color: #8c2c27; font-size: .94rem; }
    .foot { border-top: 1px solid #e6ebf2; padding-top: 16px; margin-top: 22px; font-size: .82rem; color: #667386; }
    .back { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 14px 0 0; font-size: .86rem; }
    .back a { color: #116b53; font-weight: 650; text-decoration: none; }
    .back a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .back a:focus-visible { outline: 3px solid #4bb99c80; outline-offset: 2px; border-radius: 4px; }
    @media (prefers-reduced-motion: no-preference) { main { animation: arrive .22s ease-out both; } @keyframes arrive { from { opacity: .7; transform: translateY(5px); } to { opacity: 1; transform: none; } } }
  </style>
</head>
<body>
  <main>
    <div class="brand">SIAGA.ID · OPERATIONS</div>
    <h1>Masuk sebagai admin</h1>
    <p>Area operasi hanya tersedia untuk admin yang terautentikasi.</p>
    <form id="formLogin" autocomplete="on">
      <label for="password">Password admin</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Masuk</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <div class="foot">Sesi dilindungi cookie aman dan berakhir otomatis setelah 8 jam.</div>
    <nav class="back" aria-label="Kembali ke situs">
      <a href="/">&larr; Kembali ke beranda</a>
      <a href="/dashboard">Buka dashboard</a>
      <a href="/tentang-data">Tentang data</a>
    </nav>
  </main>
  <script src="/admin-login.js"></script>
</body>
</html>
